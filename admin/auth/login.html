<body class="font-body-md text-body-md bg-background text-on-background antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Screen Wrapper -->
<!-- Screen Wrapper -->
<main class="min-h-screen bg-slate-50 flex items-center justify-center p-4 lg:p-8">
    <!-- Main Card (Grid Locked) -->
    <div class="w-full max-w-4xl min-h-[600px] bg-white/90 backdrop-blur-xl rounded-[2rem] shadow-2xl shadow-teal-900/20 overflow-hidden grid grid-cols-1 md:grid-cols-2 border border-white shrink-0 my-auto relative z-10">
        
        <!-- Bagian Kiri (Identik Universal) -->
        <div class="bg-primary-container p-8 md:p-12 flex flex-col items-center justify-center text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-64 h-64 bg-white/5 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 right-0 w-80 h-80 bg-secondary-container/10 rounded-full blur-3xl translate-x-1/3 translate-y-1/3"></div>
            <div class="bg-white/10 p-4 rounded-3xl backdrop-blur-sm mb-6 z-10">
                <img alt="Zeera Laundry Logo" class="w-28 h-28 object-cover rounded-2xl shadow-lg" src="../../assets/logo-zeera.jpg"/>
            </div>
            <h1 class="font-display text-3xl md:text-4xl font-extrabold text-white mb-3 z-10 tracking-tight leading-tight">Sistem Manajemen<br>Zeera</h1>
            <p class="font-body-md text-teal-100 z-10 max-w-xs text-sm leading-relaxed">Kelola operasional, pantau transaksi, dan tingkatkan efisiensi laundry.</p>
        </div>

        <!-- Bagian Kanan (Form) -->
        <div class="bg-white p-8 md:p-12 flex flex-col justify-center">
            <div class="mb-8">
                <h2 class="font-display text-2xl font-bold text-slate-800 mb-1.5">Selamat Datang</h2>
                <p class="font-body-md text-slate-500 text-sm">Silakan masuk untuk melanjutkan.</p>
            </div>
            <form id="formLogin" class="space-y-5 transition-all duration-300">
                <div>
                    <label class="block font-semibold text-slate-600 text-sm mb-1.5" for="email">Alamat Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-slate-400 text-[20px]">mail</span>
                        </div>
                        <input class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl shadow-inner focus:ring-1 focus:ring-[#0F766E] focus:border-[#0F766E] transition-colors text-sm text-slate-800 outline-none" id="email" name="email" placeholder="nama@gmail.com" required type="email"/>
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 text-sm mb-1.5" for="password">Kata Sandi</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <span class="material-symbols-outlined text-slate-400 text-[20px]">lock</span>
                        </div>
                        <input class="w-full pl-11 pr-12 py-2.5 bg-slate-50 border border-slate-200 rounded-xl shadow-inner focus:ring-1 focus:ring-[#0F766E] focus:border-[#0F766E] transition-colors text-sm text-slate-800 tracking-widest outline-none placeholder:tracking-widest" id="password" name="password" placeholder="••••••••" required type="password"/>
                        <button id="toggle-pass" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-[#0F766E] transition-colors focus:outline-none" type="button">
                            <span id="eye-icon" class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                </div>
                <div class="flex items-center justify-between pt-1">
                    <div class="flex items-center">
                        <input class="h-4 w-4 text-[#0F766E] focus:ring-[#0F766E] border-slate-300 rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
                        <label class="ml-2 block text-sm font-medium text-slate-600 cursor-pointer" for="remember-me">Ingat saya</label>
                    </div>
                    <div class="text-sm">
                        <a class="font-bold text-[#0F766E] hover:text-teal-800 transition-colors" href="lupa-sandi.html">Lupa sandi?</a>
                    </div>
                </div>
                <div class="pt-4">
                    <button class="w-full bg-[#0F766E] text-white rounded-full py-3 text-[15px] font-bold shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all flex items-center justify-center space-x-2" type="submit">
                        <span>Masuk</span>
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                    </button>
                </div>
                <div class="mt-6 text-center text-sm text-slate-500">
                    Belum punya akun? <a class="text-[#0F766E] font-bold hover:underline" href="daftar-akun.html">Daftar di sini</a>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
    // 1. Fitur Visibilitas Password
    const togglePassword = document.getElementById('toggle-pass');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if(togglePassword) {
        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });
    }

    // 2. Real API Login
    document.getElementById('formLogin').addEventListener('submit', async function(e) {
        e.preventDefault();
        const emailInput = document.getElementById('email').value;
        const passwordInputValue = document.getElementById('password').value;
        const btnSubmit = document.querySelector('button[type="submit"]');
        
        const originalBtnText = btnSubmit.innerHTML;
        btnSubmit.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">autorenew</span><span>Memeriksa...</span>';
        btnSubmit.disabled = true;

        try {
            const response = await fetch('http://127.0.0.1:8000/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailInput, password: passwordInputValue })
            });
            
            const data = await response.json();

            if (response.ok && data.token) {
                localStorage.setItem('zeera_token', data.token);
                if(data.user) localStorage.setItem('zeera_user', JSON.stringify(data.user));
                window.location.href = '../dashboard.html';
            } else {
                alert(data.detail || data.message || 'Login gagal! Periksa kembali Email dan Kata Sandi Anda.');
                btnSubmit.innerHTML = originalBtnText; btnSubmit.disabled = false;
            }
        } catch (error) {
            console.error("API Error:", error);
            alert('Gagal mengeksekusi sistem: ' + error.message);
            btnSubmit.innerHTML = originalBtnText; btnSubmit.disabled = false;
        }
    });
</script>
</body>
